<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>libreble social card</title>
<!--
  1200x630 Open Graph card template. Parameterised via the query string:
    ?kicker=ICG%20IC-6%20indoor%20bike&title=Bikefit&subtitle=One%20line%20on%20what%20it%20does&path=bikefit
  Render with headless Chrome (fonts load from Google Fonts when online):
    google-chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1200,717 \
      --virtual-time-budget=6000 --screenshot=/abs/og/NAME.png "file:///abs/og/card.html?title=..."
  then crop to 1200x630 (headless=new keeps ~87px of window chrome; see render.sh).
  See og/render.sh for the exact cards.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #0e1216;
    --ink: #e9edf1;
    --ink-2: #c4cdd6;
    --muted: #98a4b1;
    --line: #2a323c;
    --led: #ffa259;
    --led-fill: #ff8a3d;
  }
  html, body { margin: 0; background: var(--paper); }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    color: var(--ink);
    font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .brand { position: absolute; top: 64px; left: 72px; display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 52px; height: 52px; }
  .wordmark { font-weight: 800; font-stretch: 112%; font-size: 30px; letter-spacing: -0.02em; line-height: 1; }
  .wordmark .ble { color: var(--led); }

  .beacon { position: absolute; right: 72px; top: 50%; transform: translateY(-50%); width: 320px; height: 320px; }

  .text { position: absolute; left: 72px; right: 440px; bottom: 64px; display: flex; flex-direction: column; gap: 18px; }
  .kicker { font-size: 21px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--led); text-wrap: balance; line-height: 1.4; }
  .title {
    margin: 0; font-weight: 800; font-stretch: 108%; font-size: 92px; line-height: 0.98;
    letter-spacing: -0.035em; text-wrap: balance;
  }
  .title.long { font-size: 72px; }
  .title.xlong { font-size: 60px; }
  .subtitle { margin: 0; font-size: 30px; line-height: 1.3; color: var(--ink-2); max-width: 20em; text-wrap: pretty; }
  .url { font-size: 22px; color: var(--muted); margin-top: 8px; }
  .url b { font-weight: 500; color: var(--ink-2); }
  .mark .ring { fill: none; stroke: var(--ink); stroke-width: 5.5; stroke-linecap: round; }
  .mark .led { fill: var(--led-fill); }
</style>
</head>
<body>
  <div class="brand">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <g transform="rotate(-45 32 32)">
        <path class="ring" d="M44.36 40.50A15 15 0 1 1 44.36 23.50"/>
        <path class="ring" d="M54.69 42.50A25 25 0 1 1 54.69 21.50"/>
        <circle class="led" cx="32" cy="32" r="6.5"/>
      </g>
    </svg>
    <span class="wordmark">libre<span class="ble">ble</span></span>
  </div>

  <svg class="mark beacon" viewBox="0 0 64 64" aria-hidden="true">
    <g transform="rotate(-45 32 32)">
      <path class="ring" d="M44.36 40.50A15 15 0 1 1 44.36 23.50"/>
      <path class="ring" d="M54.69 42.50A25 25 0 1 1 54.69 21.50"/>
      <circle class="led" cx="32" cy="32" r="6.5"/>
    </g>
  </svg>

  <div class="text">
    <div class="kicker mono" id="kicker">Web Bluetooth, no vendor in between</div>
    <h1 class="title" id="title">Your devices, set free.</h1>
    <p class="subtitle" id="subtitle">Web apps that talk to Bluetooth gadgets directly, in Chrome. No account, no cloud, every protocol documented.</p>
    <div class="url mono" id="url"><b>libreble.github.io</b></div>
  </div>

  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var set = function (id, key) { var v = q.get(key); if (v !== null) document.getElementById(id).textContent = v; };
      set("kicker", "kicker"); set("title", "title"); set("subtitle", "subtitle");
      var t = document.getElementById("title");
      if (t.textContent.length > 30) t.classList.add("xlong"); else if (t.textContent.length > 14) t.classList.add("long");
      var path = q.get("path");
      if (path) document.getElementById("url").innerHTML = "<b>libreble.github.io</b>/" + path.replace(/[<>&]/g, "") + "/";
    })();
  </script>
</body>
</html>
